# TRES ESTRUCTURAS — Configuracion de Netlify
# El deploy corre el generador de SEO: crea las paginas /p/{codigo}
# (previews de WhatsApp) y el sitemap a partir de propiedades.json.
# Publicar ahora se hace desde el panel: /admin/ -> "Publicar en el sitio".

[build]
  command = "node herramientas/generar.js"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ------------------------------------------------------------------
# Seguridad
# ------------------------------------------------------------------
# Los unicos origenes externos que el sitio usa de verdad son las fuentes
# de Google, las miniaturas de YouTube (i.ytimg.com), los embeds de
# youtube-nocookie, wa.me y —solo como respaldo del panel— cdnjs.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://i.ytimg.com; media-src 'self' blob:; connect-src 'self'; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# El panel no se indexa nunca, y no se guarda en ningun cache intermedio
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Fotos y librerias: cache larga. Ahora es seguro, porque cada foto tiene
# un nombre unico: nunca se reemplaza un archivo, siempre se agrega uno nuevo.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/lib/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML y datos: siempre frescos
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# El service worker manda sobre todo lo demas: nunca se cachea
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
